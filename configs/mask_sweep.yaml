command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
method: grid
project: robocasa_eval_new
metric:
  goal: maximize
  name: Avg_Test_Reward
name: mask_objects_ablation
parameters:
  manager.mask_objects:
    values:
      - []
      - ["Wall", "Counter", "Floor"]
      - ["PandaMobile", "PandaGripper"]
      - ["PandaMobile", "PandaGripper", "Wall", "Counter", "Floor"]

program: main.py
